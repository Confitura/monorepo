version: '3.8'

services:
  postgres:
    image: postgres:16.10
    container_name: jelatyna-postgres
    environment:
      POSTGRES_DB: jelatyna
      POSTGRES_USER: jelatyna
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      # A new volume: Postgres 16 can't open the old postgres:14 `postgres_data` volume, which is left untouched.
      - postgres16_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jelatyna"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres16_data:
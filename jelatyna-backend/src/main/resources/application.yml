server:
  port: 8080
  servlet:
    context-path: /api

twitter:
  api-key: KEY
  api-secret: SECRET
  callback: http://localhost:8080/login
  access-token: TOKEN
  access-token-secret: TOKEN_SECRET
spring:
  application:
    name: jelatyna-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/jelatyna
    username: jelatyna
    password: password
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.hibernate: INFO
    com.microtripit: INFO

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  # Trace every request; whether a trace leaves the process is up to the OTLP export settings.
  tracing:
    sampling:
      probability: 1.0
  # Metrics are scraped from /actuator/prometheus. Micrometer's OTLP registry would push them
  # over HTTP every minute to a receiver that doesn't exist, and IDEA's plugin accepts only gRPC.
  otlp:
    metrics:
      export:
        enabled: false

ui.origin: "https://2025.confitura.pl/"
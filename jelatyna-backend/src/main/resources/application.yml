server:
  port: 8080
  servlet:
    context-path: /api

twitter:
  api-key: KEY
  api-secret: SECRET
  callback: http://localhost:8080/login
  access-token: TOKEN
  access-token-secret: TOKEN_SECRET
spring:
  application:
    name: jelatyna-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/jelatyna
    username: jelatyna
    password: password
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.hibernate: INFO
    com.microtripit: INFO

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

ui.origin: "https://2025.confitura.pl/"
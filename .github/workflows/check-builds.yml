name: check builds

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin-app: ${{ steps.filter.outputs.admin-app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'jelatyna-backend/**'
            frontend:
              - 'webpage/**'
            admin-app:
              - 'admin-app/**'

  build-webpage:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build webpage
        run: docker build -f webpage/docker/Dockerfile webpage

  build-admin-app:
    needs: changes
    if: needs.changes.outputs.admin-app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build admin-app
        run: |
          docker build \
            -f admin-app/docker/Dockerfile \
            --build-arg VITE_API_URL=https://api.confitura.pl/api \
            --build-arg VITE_SELF_URL=https://app.confitura.pl \
            admin-app

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # Restore only: deploy-images.yml's push-backend owns this cache and saves it.
      - name: Restore Paketo builder
        id: paketo-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/paketo-builder.tar
          key: paketo-builder-${{ hashFiles('jelatyna-backend/pom.xml') }}
          restore-keys: paketo-builder-
      - name: Load Paketo builder
        if: steps.paketo-cache.outputs.cache-matched-key != ''
        run: docker load -i /tmp/paketo-builder.tar
      - name: Build backend
        run: cd jelatyna-backend && ./mvnw spring-boot:build-image -DskipTests

  all-builds-passed:
    runs-on: ubuntu-latest
    needs: [build-webpage, build-admin-app, build-backend]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more builds failed"
            exit 1
          fi
          echo "All builds passed or were skipped"

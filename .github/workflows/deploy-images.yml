name: deploy images

# Archive branch for the 2026 edition: deploys only the webpage, to the
# 2026 archive Coolify resource. Backend and admin-app are shared and are
# deployed from master only — never from here.
on:
  push:
    branches: [ archive-2026 ]
    paths: [ 'webpage/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-webpage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push webpage
        # Tagged :archive-2026, never :latest — master publishes :latest for the current edition.
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/confitura-webpage
          IMAGE=${IMAGE,,}
          docker buildx build \
            -f webpage/docker/Dockerfile \
            --cache-from type=gha,scope=webpage-archive-2026 \
            --cache-to type=gha,mode=max,scope=webpage-archive-2026 \
            -t $IMAGE:archive-2026 \
            -t $IMAGE:archive-2026-${{ github.sha }} \
            --push \
            webpage
      - name: Trigger Coolify deployment
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "https://admin.confitura.pl/api/v1/deploy?uuid=jjbrvlzsq0ck1oqx46b0i0v6&force=true"

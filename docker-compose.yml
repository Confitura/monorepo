version: "3.3"
services:

#  frontend:
#    build: confitura-vue
#    volumes:
#      - ./confitura-vue/src:/opt/app/src

  backend:
    build: jelatyna-backend
    volumes:
      - ./jelatyna-backend/src:/opt/app/src
    environment:
      SPRING_PROFILES_ACTIVE: local,fake-security
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jelatyna
      SPRING_DATASOURCE_USERNAME: jelatyna
      SPRING_DATASOURCE_PASSWORD: password
    links:
      - postgres

  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/config:/etc/nginx/conf.d
      - ./docker/nginx/data:/www/data
    links:
#      - frontend
      - backend

  postgres:
    image: postgres:16.10
    restart: always
    environment:
      POSTGRES_DB: 'jelatyna'
      POSTGRES_USER: 'jelatyna'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5432:5432'
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

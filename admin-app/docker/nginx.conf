# Same as nginx's built-in "combined", minus $remote_addr: client IPs are personal data
# under GDPR and these logs get shipped off the box.
log_format no_ip '- $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log no_ip;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
